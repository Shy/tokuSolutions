# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  deploy:
    needs: checks
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install locked production environment
        run: |
          python -m pip install uv
          uv sync --locked --no-dev

      - name: Generate catalog with the application implementation
        run: uv run --no-sync python -m src.cli reindex

      - name: Setup deployment directory
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp -r manuals _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge Cloudflare Cache
        if: success()
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare secrets are not configured; skipping optional cache purge."
            exit 0
          fi
          # Always purge core site files that affect functionality
          URLS='"https://toku.solutions/index.html","https://toku.solutions/app.js","https://toku.solutions/styles.css","https://toku.solutions/meta.json"'

          # Add any changed files in web/ or manuals/
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^(web|manuals)/' || echo "")

          while IFS= read -r file; do
            if [ ! -z "$file" ]; then
              # Remove web/ prefix for web files, keep manuals/ prefix for manual files
              if [[ "$file" == web/* ]]; then
                URL_PATH="${file#web/}"
              else
                URL_PATH="$file"
              fi
              URLS="$URLS,\"https://toku.solutions/$URL_PATH\""
            fi
          done <<< "$CHANGED_FILES"

          # Purge cache
          echo "Purging Cloudflare cache for core files and changes..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"files\":[$URLS]}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response: $BODY"

          if [ "$HTTP_CODE" -eq 200 ] && echo "$BODY" | grep -q '"success":true'; then
            echo "✅ Cloudflare cache purged successfully"
          else
            echo "⚠️  Cloudflare purge response: HTTP $HTTP_CODE"
            echo "This is non-fatal - deployment continues"
          fi
