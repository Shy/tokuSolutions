[project]
name = "toy-translator"
version = "0.1.0"
description = "OCR and translation system for Japanese toy instruction manuals using Google Cloud Document AI and Temporal"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "tokuSolutions"}
]
keywords = ["ocr", "translation", "document-ai", "temporal", "japanese", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "click>=8.5.0",
    "ftfy>=6.3.1",
    "google-cloud-documentai>=3.17.0",
    "google-cloud-translate>=3.28.0",
    "openai>=3.42.1",
    "openai-agents>=0.22.3,<0.23",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "pydantic>=2.14.2",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "temporalio>=1.35.0",
    "temporalio-openai-agents>=1.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-requests>=2.33.0.20261030",
]

[tool.mypy]
# PyMuPDF 2.1 ships partial typing; its constructors/codecs remain untyped.
untyped_calls_exclude = ["pymupdf"]
